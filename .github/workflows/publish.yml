name: Publish to RubyGems

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: Publish to RubyGems
    runs-on: ubuntu-latest
    environment: rubygems
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ruby/setup-ruby pinned to v1
      - name: Set up Ruby
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1
        with:
          ruby-version: '3.3'

      - name: Verify tag matches version.rb
        run: |
          set -euo pipefail
          PKG_VERSION="$(ruby -Ilib -e 'require "scanandpay/version"; print ScanAndPay::VERSION')"
          EXPECTED_TAG="v${PKG_VERSION}"
          if [ "${GITHUB_REF_NAME}" != "${EXPECTED_TAG}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match version.rb (${EXPECTED_TAG})."
            exit 1
          fi

      - name: Build gem
        run: |
          gem build scanandpay.gemspec

      # rubygems/configure-rubygems-credentials pinned to v2.1.0
      - name: Configure RubyGems Credentials
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0

      - name: Publish to RubyGems
        run: |
          set -euo pipefail
          PKG_VERSION="$(ruby -Ilib -e 'require "scanandpay/version"; print ScanAndPay::VERSION')"
          gem push "scanandpay-${PKG_VERSION}.gem"
